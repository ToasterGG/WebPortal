<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Viewer Dashboard</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; font-family: sans-serif; overflow: hidden; display: flex; flex-direction: column; background-color: #1a1a1a; }
        #nav-bar { width: 100%; background-color: #2c2c2c; padding: 10px; display: flex; gap: 10px; align-items: center; }
        #url-input { flex-grow: 1; padding: 8px 12px; border: none; border-radius: 4px; font-size: 14px; background-color: #3d3d3d; color: #fff; outline: none; }
        #go-btn { padding: 8px 16px; background-color: #007acc; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        #go-btn:hover { background-color: #005999; }
        #viewer-frame { width: 100%; flex-grow: 1; border: none; background-color: white; }
    </style>
</head>
<body>

    <div id="nav-bar">
        <input type="text" id="url-input" placeholder="Enter URL or search term..." value="duckduckgo.com">
        <button id="go-btn" onclick="navigate()">Go</button>
    </div>

    <iframe id="viewer-frame" src=""></iframe>

    <script>
        function navigate() {
            let input = document.getElementById('url-input').value.trim();
            const iframe = document.getElementById('viewer-frame');

            if (!input) return;

            // Turn text into a clean DuckDuckGo HTML query search structure
            if (!input.includes('.') || input.includes(' ')) {
                input = 'https://duckduckgo.com' + encodeURIComponent(input);
            }

            if (!/^https?:\/\//i.test(input)) {
                input = 'https://' + input;
            }

            // Route absolutely everything directly through the Render proxy wrapper pipeline
            iframe.src = window.location.origin + '/proxy?url=' + encodeURIComponent(input);
        }

        window.onload = function() {
            navigate();
        };

        document.getElementById('url-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') { navigate(); }
        });
    </script>
</body>
</html>
