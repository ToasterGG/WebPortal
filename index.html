<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise Network Application Manager</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; overflow: hidden; display: flex; flex-direction: column; background-color: #1a1a1c; color: #333; }
        #nav-bar { width: 100%; background-color: #242428; padding: 12px 16px; display: flex; gap: 12px; align-items: center; border-bottom: 1px solid #323238; }
        #url-input { flex-grow: 1; padding: 8px 12px; border: 1px solid #45454e; border-radius: 4px; font-size: 14px; background-color: #1c1c1e; color: #fff; outline: none; }
        #url-input:focus { border-color: #007acc; }
        #go-btn { padding: 8px 20px; background-color: #007acc; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: 600; font-size: 13px; }
        #go-btn:hover { background-color: #005999; }
        
        #display-container { width: 100%; flex-grow: 1; position: relative; background-color: #ffffff; }
        
        #terminal-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: #111112; color: #d4d4d6; font-family: Consolas, "Liberation Mono", Menlo, Courier, monospace; padding: 24px; overflow-y: auto; font-size: 13px; line-height: 1.6; z-index: 100; display: block; }
        .log-line { margin-bottom: 6px; border-left: 3px solid #007acc; padding-left: 10px; }
        .log-error { border-left-color: #f85149; color: #f85149; font-weight: 500; background-color: rgba(248, 81, 73, 0.05); padding: 6px 10px; border-radius: 0 4px 4px 0; }
        .log-warn { border-left-color: #d29922; color: #d29922; }
        .log-success { border-left-color: #58a6ff; color: #58a6ff; }
        
        #viewer-frame { width: 100%; height: 100%; border: none; background-color: #ffffff; display: none; }
    </style>
</head>
<body>

    <div id="nav-bar">
        <input type="text" id="url-input" placeholder="Enter target application URI..." value="https://duckduckgo.com">
        <button id="go-btn" onclick="executeSystemNavigation()">Execute Route</button>
    </div>

    <div id="display-container">
        <div id="terminal-overlay"></div>
        <iframe id="viewer-frame" src=""></iframe>
    </div>

    <script>
        let initTimestamp = 0;
        let diagnosticInterval = null;

        function appendSystemLog(message, securityLevel = 'info') {
            const logContainer = document.getElementById('terminal-overlay');
            const logElement = document.createElement('div');
            logElement.className = 'log-line';
            
            if (securityLevel === 'error') logElement.className += ' log-error';
            if (securityLevel === 'warn') logElement.className += ' log-warn';
            if (securityLevel === 'success') logElement.className += ' log-success';

            const localTime = new Date().toLocaleTimeString();
            logElement.innerText = `[${localTime}] [SYS_${securityLevel.toUpperCase()}] ${message}`;
            logContainer.appendChild(logElement);
            logContainer.scrollTop = logContainer.scrollHeight;
        }

        async function executeSystemNavigation() {
            let uriInput = document.getElementById('url-input').value.trim();
            const iframe = document.getElementById('viewer-frame');
            const terminal = document.getElementById('terminal-overlay');

            if (!uriInput) return;

            terminal.innerHTML = '';
            terminal.style.display = 'block';
            iframe.style.display = 'none';

            appendSystemLog('Initializing connection handshake protocol...', 'info');

            if (!uriInput.includes('.') || uriInput.includes(' ')) {
                appendSystemLog(`Unstructured syntax detected. Normalizing query format via secure search index wrapper...`, 'warn');
                uriInput = 'https://duckduckgo.com?q=' + encodeURIComponent(uriInput);
            } else if (!/^https?:\/\//i.test(uriInput)) {
                uriInput = 'https://' + uriInput;
            }

            appendSystemLog(`Target URI verified: ${uriInput}`, 'info');
            
            initTimestamp = performance.now();
            if (diagnosticInterval) clearInterval(diagnosticInterval);
            
            diagnosticInterval = setInterval(() => {
                const totalElapsedSeconds = ((performance.now() - initTimestamp) / 1000).toFixed(2);
                let durationElement = document.getElementById('performance-timer-node');
                if (!durationElement) {
                    durationElement = document.createElement('div');
                    durationElement.id = 'performance-timer-node';
                    durationElement.className = 'log-line log-warn';
                    terminal.appendChild(durationElement);
                }
                durationElement.innerText = `[LATENCY_MONITOR] Current execution time: ${totalElapsedSeconds}s (Awaiting microservice response packet from host environment...)`;
            }, 100);

            try {
                appendSystemLog('Establishing telemetry tunnel with backend asset-rewriting framework...', 'info');
                
                // Compile the gateway address routing pattern directly
                const structuredProxyUrl = window.location.origin + '/gateway?url=' + encodeURIComponent(uriInput);
                
                clearInterval(diagnosticInterval);
                const finalLatency = ((performance.now() - initTimestamp) / 1000).toFixed(2);

                appendSystemLog(`Tunnel handshake established. Network route schema built successfully in ${finalLatency}s.`, 'success');
                appendSystemLog(`Mounting compiled assets into the active viewport container...`, 'info');

                iframe.src = structuredProxyUrl;

                iframe.onload = function() {
                    appendSystemLog(`DOM elements fully parsed and initialized. Swapping views to targeted network layout.`, 'success');
                    setTimeout(() => {
                        terminal.style.display = 'none';
                        iframe.style.display = 'block';
                    }, 400);
                };

            } catch (systemException) {
                clearInterval(diagnosticInterval);
                appendSystemLog(`CRITICAL_INFRASTRUCTURE_FAILURE: Routing handshake terminated prematurely.`, 'error');
                appendSystemLog(`Diagnostics: ${systemException.message}`, 'error');
            }
        }

        window.onload = function() {
            executeSystemNavigation();
        };

        document.getElementById('url-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') { executeSystemNavigation(); }
        });
    </script>
</body>
</html>
