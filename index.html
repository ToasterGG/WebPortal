<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Web View Manager</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; font-family: system-ui, sans-serif; overflow: hidden; display: flex; flex-direction: column; background-color: #1a1a1e; }
        #nav-bar { width: 100%; background-color: #252529; padding: 12px; display: flex; gap: 10px; align-items: center; border-bottom: 1px solid #333; }
        #url-input { flex-grow: 1; padding: 10px 14px; border: 1px solid #444; border-radius: 6px; font-size: 14px; background-color: #121214; color: #fff; outline: none; }
        #url-input:focus { border-color: #007acc; }
        #go-btn { padding: 10px 20px; background-color: #007acc; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 14px; }
        #go-btn:hover { background-color: #005999; }
        #viewer-frame { width: 100%; flex-grow: 1; border: none; background-color: white; }
    </style>
</head>
<body>

    <div id="nav-bar">
        <input type="text" id="url-input" placeholder="Type search text or full destination URL..." value="wikipedia.org">
        <button id="go-btn" onclick="triggerNavigation()">Launch</button>
    </div>

    <iframe id="viewer-frame" src=""></iframe>

    <script>
        function triggerNavigation() {
            let input = document.getElementById('url-input').value.trim();
            const iframe = document.getElementById('viewer-frame');

            if (!input) return;

            // Convert raw query terms into plain DuckDuckGo text parameters
            if (!input.includes('.') || input.includes(' ')) {
                input = 'https://duckduckgo.com' + encodeURIComponent(input);
            } else if (!/^https?:\/\//i.test(input)) {
                input = 'https://' + input;
            }

            // Direct iframe source update to use your server proxy pipeline endpoint
            iframe.src = window.location.origin + '/proxy?url=' + encodeURIComponent(input);
        }

        window.onload = function() {
            triggerNavigation();
        };

        document.getElementById('url-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') { triggerNavigation(); }
        });
    </script>
</body>
</html>
