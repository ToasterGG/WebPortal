<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise Network Dashboard</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; font-family: -apple-system, sans-serif; overflow: hidden; display: flex; flex-direction: column; background-color: #111112; color: #fff; }
        #nav-bar { width: 100%; background-color: #242428; padding: 12px; display: flex; gap: 10px; align-items: center; border-bottom: 1px solid #323238; }
        #url-input { flex-grow: 1; padding: 10px 14px; border: 1px solid #45454e; border-radius: 6px; font-size: 14px; background-color: #1c1c1e; color: #fff; outline: none; }
        #go-btn { padding: 10px 22px; background-color: #007acc; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 14px; }
        #display-container { width: 100%; flex-grow: 1; position: relative; background-color: #fff; }
        #terminal-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: #111112; color: #d4d4d6; font-family: monospace; padding: 24px; overflow-y: auto; font-size: 13px; line-height: 1.6; z-index: 100; }
        .log-line { margin-bottom: 6px; border-left: 3px solid #007acc; padding-left: 10px; }
        .log-warn { border-left-color: #d29922; color: #d29922; }
        .log-success { border-left-color: #58a6ff; color: #58a6ff; }
        #viewer-frame { width: 100%; height: 100%; border: none; display: none; background-color: white; }
    </style>
</head>
<body>

    <div id="nav-bar">
        <input type="text" id="url-input" value="https://duckduckgo.com">
        <button id="go-btn" onclick="navigateSystem()">Execute Route</button>
    </div>

    <div id="display-container">
        <div id="terminal-overlay"></div>
        <iframe id="viewer-frame" src=""></iframe>
    </div>

    <script>
        let startTime = 0;
        let timerInterval = null;

        function appendLog(msg, level = 'info') {
            const container = document.getElementById('terminal-overlay');
            const el = document.createElement('div');
            el.className = 'log-line';
            if (level === 'warn') el.className += ' log-warn';
            if (level === 'success') el.className += ' log-success';
            el.innerText = `[${new Date().toLocaleTimeString()}] [SYS_${level.toUpperCase()}] ${msg}`;
            container.appendChild(el);
            container.scrollTop = container.scrollHeight;
        }

        function navigateSystem() {
            let input = document.getElementById('url-input').value.trim();
            const iframe = document.getElementById('viewer-frame');
            const terminal = document.getElementById('terminal-overlay');

            if (!input) return;

            terminal.innerHTML = '';
            terminal.style.display = 'block';
            iframe.style.display = 'none';

            appendLog('Initializing connection handshake protocol...', 'info');

            if (!input.includes('.') || input.includes(' ')) {
                appendLog('Normalizing raw parameter data elements via search index wrapper...', 'warn');
                input = 'https://duckduckgo.com?q=' + encodeURIComponent(input);
            } else if (!/^https?:\/\//i.test(input)) {
                input = 'https://' + input;
            }

            appendLog(`Target URI verified: ${input}`, 'info');
            
            startTime = performance.now();
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                const elapsed = ((performance.now() - startTime) / 1000).toFixed(2);
                let tNode = document.getElementById('timer-node');
                if (!tNode) {
                    tNode = document.createElement('div');
                    tNode.id = 'timer-node';
                    tNode.className = 'log-line log-warn';
                    terminal.appendChild(tNode);
                }
                tNode.innerText = `[LATENCY_MONITOR] Current execution time: ${elapsed}s (Streaming deployment data blocks...)`;
            }, 100);

            iframe.src = window.location.origin + '/gateway?url=' + encodeURIComponent(input);

            iframe.onload = function() {
                clearInterval(timerInterval);
                appendLog('Handshake complete. Swapping views to network layout.', 'success');
                setTimeout(() => {
                    terminal.style.display = 'none';
                    iframe.style.display = 'block';
                }, 500);
            };
        }

        window.onload = function() {
            navigateSystem();
        };

        document.getElementById('url-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') navigateSystem();
        });
    </script>
</body>
</html>
